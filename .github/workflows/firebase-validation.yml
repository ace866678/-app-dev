name: Firebase Auth and Firestore validation

on:
  pull_request:
    paths:
      - "research-room-app/**"
      - ".github/workflows/firebase-validation.yml"

permissions:
  contents: read

concurrency:
  group: firebase-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: research-room-app/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: research-room-app
        run: npm ci

      - name: Build
        working-directory: research-room-app
        run: npm run build

      - name: Run Firestore rules tests in local emulators
        working-directory: research-room-app
        run: npx --yes firebase-tools@15.33.0 emulators:exec --only auth,firestore --project research-room-test "npm run test:rules"
